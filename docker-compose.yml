services:
  # Аудиосервер: декодирует и стримит музыку в голосовой канал
  # (собирается из lavalink/Dockerfile: Lavalink 4 + плагин Soundy для SoundCloud)
  lavalink:
    build: ./lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx768m
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    expose:
      - "2333"
    depends_on:
      - spotify-tokener

  # Выдаёт анонимные токены Spotify для LavaSrc (ссылки Spotify и радио).
  # Без него LavaSrc не может обращаться к Spotify. Сделан автором LavaSrc, внутри — headless Chrome.
  spotify-tokener:
    image: ghcr.io/topi314/spotify-tokener:master
    restart: unless-stopped
    environment:
      - SPOTIFY_TOKENER_ADDR=0.0.0.0:8080
      - SPOTIFY_TOKENER_LOG_LEVEL=INFO
    expose:
      - "8080"

  # Сам бот
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
    depends_on:
      - lavalink
      - rsshub
    volumes:
      - ./data:/app/data       # база данных (настройки, приватки, прочитанные новости)
      - ./config:/app/config   # роли, фразы приветствий, ленты новостей — можно править без пересборки
      - ./assets:/app/assets   # картинки уток и фон приветствия

  # RSSHub превращает Telegram-каналы (и сайты без RSS) в RSS-ленты.
  # Нужен для новостей из Telegram (аниме, кино). Доступен только боту, наружу не открыт.
  rsshub:
    image: diygod/rsshub:latest
    restart: unless-stopped
    environment:
      - CACHE_EXPIRE=300
    expose:
      - "1200"
